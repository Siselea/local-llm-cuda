name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (windows-latest, full build.sh)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ziglang (portable C++ compiler, no MSVC/CUDA Toolkit)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ziglang>=0.13"

      - name: Build every target with build.sh
        shell: bash
        run: bash build.sh

      - name: Verify produced binaries (PE subsystem smoke)
        shell: bash
        run: |
          set -e
          ls -lh build/engine.exe build/launcher.exe
          python - <<'PY'
          import struct, pathlib
          for name, want in [("build/engine.exe", 3), ("build/launcher.exe", 2)]:
              data = pathlib.Path(name).read_bytes()[:0x400]
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              sub = struct.unpack_from("<H", data, pe + 24 + 68)[0]
              print(f"{name}: subsystem={sub} (want {want})")
              assert sub == want, (name, sub, want)
          PY

  sanity:
    name: sanity (shell/python/README links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bash syntax of every script
        shell: bash
        run: |
          set -e
          for f in build.sh tools/*.sh; do
            bash -n "$f"
          done
          echo "bash -n: OK ($(ls tools/*.sh | wc -l) tools scripts + build.sh)"

      - name: Python syntax of every tool
        shell: bash
        run: |
          set -e
          python -m py_compile tools/*.py
          echo "py_compile: OK"

      - name: README local links
        shell: bash
        run: python tools/check_readme_links.py

  private-paths:
    name: no-private-paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a machine-specific path is committed
        shell: bash
        run: |
          set -e
          # Examples from the original development machine.  Public docs/scripts
          # use <MODEL_DIR> / <PATH> / <HOME> placeholders instead.
          # The patterns are assembled from pieces so this workflow file itself does
          # not contain machine-specific path literals (the check scans the whole tree).
          D="D:"; U="U:"; C="C:"
          failure=0
          for pat in "${D}/p0" "${D}\\p0" "${U}/AI" "${U}\\AI" "${C}/Users" "${C}\\Users"; do
            if out=$(git grep -nF -e "$pat" -- .); then
              echo "ERROR: machine-specific path found in tracked files:" >&2
              echo "$out" >&2
              failure=1
            fi
          done
          if [ "$failure" -ne 0 ]; then exit 1; fi
          echo "private-path grep: OK (no machine-specific paths in tracked files)"
