name: Feature request / 功能建议
description: Suggest a new capability or improvement. 新功能、性能、文档或易用性建议。
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 现在哪里不好用/缺什么？请描述场景而不是只给方案。
      placeholder: e.g. 希望 launcher 支持直接输入 HuggingFace repo id 下载模型。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 可选实现思路、命令行/UI 形态、与现有配置项的关系。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你试过的 workaround 或其它工具的做法。
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 环境（可选 / optional）
      placeholder: Windows 11 · RTX 3060 12GB · 9B Q5_K_M
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已搜索现有 issue/文档，确认不是已支持的功能。
          required: true
